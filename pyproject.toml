[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rfc9741-pure"
version = "0.1.0"
description = "Pure-Python RFC 9741 CDDL control operators: b64u, b64c, hex, b45, base10, printf, json"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Abhishek Prasad", email = "prasad.a.abhishek@gmail.com"}]
requires-python = ">=3.11"
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
dependencies = []

[project.scripts]
rfc9741pure = "rfc9741pure.cli:main"

[project.urls]
Home = "https://github.com/prasad-a-abhishek/rfc-9741-pure"
Repository = "https://github.com/prasad-a-abhishek/rfc-9741-pure"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_"]
addopts = "-v --tb=short"
